<html>
  <head>
    <meta charset="utf-8">
    <title>CreacionesIESSLN</title>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
    <script src="dist/aframe-environment-component.min.js"></script>
    <link href="https://fonts.googleapis.com/css?family=Voces" rel="stylesheet">
  </head>
  <body>
    <a-scene xr-mode-ui="XRMode: xr" environment="preset:egypt">

      <!-- ASSETS: Carga del modelo 3D -->
      <a-assets>
            <a-asset-item id="arma" src="arma.glb"></a-asset-item>
            <a-asset-item id="alien" src="aliennn21.glb"></a-asset-item>
            <a-asset-item id="soldado" src="Soldado.glb"></a-asset-item>
        </a-assets>


        <!-- Figuras 3D -->
        <a-entity gltf-model="#arma" position="3 0 -10" scale="1 1 1" rotation="0 0 0">
        </a-entity>

        <a-entity gltf-model="#alien" position="-6 1 -10" scale="9 9 9" rotation="0 60 0">
        </a-entity>
        <a-entity gltf-model="#soldado" position="9 0 -20" scale="5 5 5" rotation="0 -45 0">
        </a-entity>

        <a-sky hide-on-enter-ar color="#87CEEB"></a-sky>
       

       
     


      
      
      
      
    </a-scene>
  </body>
</html>
